name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test LRZ wallet packages
        run: cargo test -p zcash_voting -p zcash-voting-wallet-example --locked
      - name: cargo test --features test-fixtures
        run: cargo test -p zcash_voting --features test-fixtures --locked
      - name: Test Zakura tree packages
        run: >-
          cargo test -p vote-commitment-tree -p vote-commitment-tree-client
          --all-targets --features vote-commitment-tree-client/cli --locked
      - name: Test LRZ tree packages
        run: >-
          cargo test -p vote-commitment-tree -p vote-commitment-tree-client
          --all-targets --no-default-features
          --features vote-commitment-tree/lrz,vote-commitment-tree-client/lrz,vote-commitment-tree-client/cli
          --locked

  proofs:
    name: Halo2 proof tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The end-to-end delegation proof runs keygen plus proving, so it is
      # marked #[ignore] for the default suite and run here under --release.
      - name: cargo test --release -- --ignored
        run: cargo test --release -p zcash_voting --locked -- --ignored

  msrv:
    name: Rust 1.91
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: Check LRZ wallet packages at MSRV
        run: cargo check -p zcash_voting -p zcash-voting-wallet-example --all-targets --locked
      - name: Check Zakura tree packages at MSRV
        run: >-
          cargo check -p vote-commitment-tree -p vote-commitment-tree-client
          --all-targets --features vote-commitment-tree-client/cli --locked
      - name: Check LRZ tree packages at MSRV
        run: >-
          cargo check -p vote-commitment-tree -p vote-commitment-tree-client
          --all-targets --no-default-features
          --features vote-commitment-tree/lrz,vote-commitment-tree-client/lrz,vote-commitment-tree-client/cli
          --locked
